<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEAON ERP</title>
  <link rel="stylesheet" href="/app/CSS/style.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand sidebar-brand"><div class="brand-mark">S</div><div><strong>SEAON ERP</strong><small>Manufacturing &amp; Stock</small></div></div>
      <nav id="mainNav">
        <button class="nav-item active" data-page="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-item" data-page="inventory"><span>▦</span> Inventory</button>
        <button class="nav-item" data-page="orders"><span>▤</span> Orders</button>
        <button class="nav-item" data-page="production"><span>⚙</span> Production</button>
        <button class="nav-item" data-page="bom"><span>⌘</span> BOM / Materials</button>
        <button class="nav-item" data-page="warehouse"><span>▣</span> Warehouse</button>
        <button class="nav-item" data-page="returns"><span>↩</span> Returns</button>
        <button class="nav-item" data-page="fifo"><span>◷</span> FIFO Batches</button>
        <button class="nav-item" data-page="reports"><span>▥</span> Reports</button>
        <button class="nav-item" data-page="notifications"><span>!</span> Alerts</button>
      </nav>
      <div class="sidebar-bottom">
        <a id="adminLink" class="nav-item link" href="/app/admin.html"><span>⚙</span> Admin Panel</a>
        <button class="nav-item" id="logoutBtn"><span>↪</span> Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
        <div class="topbar-heading">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">A simple view of today's operations.</p>
        </div>
        <div class="topbar-brand" aria-label="SEAON ERP"><div class="brand-mark">S</div><div><strong>SEAON ERP</strong><small>Manufacturing & Stock</small></div></div>
        <div class="topbar-right">
          <button class="icon-btn profile-trigger" id="profileToggle" type="button"
                  title="User profile" aria-label="Open user profile"
                  aria-expanded="false">♙</button>
          <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">↻</button>
          <section class="profile-popover hidden" id="profilePopover" aria-label="User profile">
            <div class="profile-popover-heading">
              <div class="profile-avatar" id="profileInitials">U</div>
              <div class="profile-identity">
                <strong id="profileName">User</strong>
                <span id="profileRole">Role</span>
              </div>
            </div>
            <div class="profile-meta">Last login: <strong id="profileLastLogin">N/A</strong></div>
            <button class="btn primary profile-password-btn" id="profileChangePassword" type="button">Change Password</button>
          </section>
        </div>
      </header>

      <div id="toastArea" class="toast-area"></div>
      <div id="page" class="page-content"></div>
    </main>
  </div>

  <script src="/app/JS/api.js"></script>
  <script src="/app/JS/auth.js"></script>
  <script src="/app/JS/app.js"></script>
</body>
</html>
